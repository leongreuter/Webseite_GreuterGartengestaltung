# Builds the website and publishes it on GitHub Pages after every push to main.
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pages-Einstellungen lesen
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # base_path is "/<repo>" for <name>.github.io/<repo>/ and empty once a
      # custom domain (e.g. www.greutergarten.ch) is configured.
      - name: Website bauen
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
